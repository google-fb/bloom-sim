name: Build static export

# Project Pages is not enabled on google-fb/bloom-sim, so actions/deploy-pages
# returns 404 ("Failed to create deployment"). The public site is built and
# published by google-fb/google-fb.github.io (Pages already enabled there).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /bloom-sim
